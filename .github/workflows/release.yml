name: Release

# Baut die Windows-Artefakte (NSIS-Installer + Portable) und veröffentlicht sie
# als GitHub-Release. Auslöser: ein Versions-Tag (z. B. `v0.1.0`) oder manuell.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Python 3.11 einrichten (für den Sidecar-Build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketversion lesen
        id: version
        shell: bash
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Ghostscript + Tesseract installieren
        shell: pwsh
        run: |
          choco install ghostscript --no-progress -y
          choco install tesseract --no-progress -y
          # Deutsches Sprachpaket aus der offiziellen Tesseract-Quelle ergänzen.
          curl.exe -L -o "C:\Program Files\Tesseract-OCR\tessdata\deu.traineddata" `
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Python-Abhängigkeiten + PyInstaller installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller

      - name: Sidecar-Binary bauen (PyInstaller)
        env:
          PYTHON: python
        run: npm run bundle:sidecar

      - name: App paketieren (Installer + Portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Artefakte des Laufs sichern
        uses: actions/upload-artifact@v4
        with:
          name: GoBDesk-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: GoBDesk v${{ env.PACKAGE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/GoBDesk-${{ env.PACKAGE_VERSION }}-x64.exe
            release/GoBDesk-${{ env.PACKAGE_VERSION }}-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
